<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Niranjan MD. Systems, infrastructure, software, research." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1020"/>
      <stop offset="1" stop-color="#1a1d3c"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a259" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#f4a259"/>
      <stop offset="0.7" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2c3263" opacity="0.55"/>
    </pattern>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- Name block -->
  <text x="70" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#e8e6f0" letter-spacing="-1">Niranjan MD</text>
  <text x="72" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#f4a259" letter-spacing="0.5">Systems · Infrastructure · Software · Research</text>
  <text x="72" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#9aa0c6">Understanding how things work under the hood,</text>
  <text x="72" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#9aa0c6">and occasionally breaking them to find out.</text>

  <!-- Network: edges -->
  <g stroke="#2c3263" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="700" y1="115" x2="900" y2="95"/>
    <line x1="700" y1="115" x2="860" y2="205"/>
    <line x1="900" y1="95" x2="860" y2="205"/>
    <line x1="900" y1="95" x2="1080" y2="175"/>
    <line x1="860" y1="205" x2="1080" y2="175"/>
    <line x1="860" y1="205" x2="740" y2="300"/>
    <line x1="860" y1="205" x2="1010" y2="310"/>
    <line x1="740" y1="300" x2="1010" y2="310"/>
    <line x1="1080" y1="175" x2="1010" y2="310"/>
  </g>

  <!-- Pulse rings -->
  <g fill="none" stroke="#5eead4" stroke-width="1.5">
    <circle cx="700" cy="115" r="9"><animate attributeName="r" values="9;26" dur="3.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="95" r="9"><animate attributeName="r" values="9;26" dur="3.6s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="205" r="9"><animate attributeName="r" values="9;26" dur="3.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="175" r="9"><animate attributeName="r" values="9;26" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="300" r="9"><animate attributeName="r" values="9;26" dur="3.6s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="310" r="9"><animate attributeName="r" values="9;26" dur="3.6s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Nodes -->
  <g fill="#0e1020" stroke="#5eead4" stroke-width="2.5">
    <circle cx="700" cy="115" r="9"/>
    <circle cx="900" cy="95" r="9"/>
    <circle cx="860" cy="205" r="9"/>
    <circle cx="1080" cy="175" r="9"/>
    <circle cx="740" cy="300" r="9" stroke="#f4a259"/>
    <circle cx="1010" cy="310" r="9" stroke="#f4a259"/>
  </g>

  <!-- Node labels -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#e8e6f0" text-anchor="middle">
    <text x="700" y="90">linux</text>
    <text x="900" y="70">networking</text>
    <text x="1080" y="150">backend</text>
    <text x="860" y="240">homelab</text>
    <text x="740" y="335" fill="#f4a259">music</text>
    <text x="1010" y="345" fill="#f4a259">coffee</text>
  </g>

  <!-- Packets -->
  <circle r="5" fill="#f4a259">
    <animateMotion dur="9s" repeatCount="indefinite" path="M700,115 L900,95 L1080,175 L1010,310 L740,300 L860,205 Z"/>
  </circle>
  <circle r="4" fill="#5eead4">
    <animateMotion dur="6s" repeatCount="indefinite" begin="1s" path="M860,205 L1080,175 L900,95 L700,115 Z"/>
  </circle>

  <!-- Bottom rule -->
  <rect x="0" y="394" width="1200" height="3" fill="url(#rule)"/>
</svg>
