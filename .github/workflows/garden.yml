name: Update profile art

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the banner for today's season or festival
        run: python3 scripts/banner.py --out dist/banner.svg --readme README.md

      - name: Build the stats panel
        run: python3 scripts/stats.py --user nimdme --out dist/stats.svg
        env:
          # Your personal token (read:user; add repo for private-repo languages)
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GARDEN_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs after publishing, so the README never points at a banner that isn't live yet
      - name: Commit README changes (festival caption, banner version)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update README for today's banner" && git pull --rebase && git push)
